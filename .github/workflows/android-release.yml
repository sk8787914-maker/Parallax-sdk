name: Parallax SDK Android Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build Parallax SDK release AAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BLACK-OPNE
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test release AAR
        run: ./gradlew :ParallaxCore:testDebugUnitTest :ParallaxCore:assembleRelease --stacktrace

      - name: Rename release AAR
        run: mv RIYAZ-VIP/build/outputs/aar/*-release.aar RIYAZ-VIP/build/outputs/aar/Zcore-release.aar

      - name: Upload release AAR
        uses: actions/upload-artifact@v4
        with:
          name: parallax-sdk-release-aar
          path: BLACK-OPNE/RIYAZ-VIP/build/outputs/aar/Zcore-release.aar
          if-no-files-found: error

  release:
    name: Publish Parallax SDK GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release AAR
        uses: actions/download-artifact@v4
        with:
          name: parallax-sdk-release-aar
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.aar
