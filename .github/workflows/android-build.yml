name: Android SDK build

on:
  pull_request:
    paths:
      - 'BLACK-OPEN/**'
      - '.github/workflows/android-build.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'BLACK-OPEN/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android AAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BLACK-OPEN
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Build release AAR
        run: ./gradlew --no-daemon :ParallaxCore:assembleRelease

      - name: Run unit tests
        run: ./gradlew --no-daemon :ParallaxCore:testDebugUnitTest

      - name: Upload release AAR
        uses: actions/upload-artifact@v4
        with:
          name: parallax-sdk-release-aar
          path: BLACK-OPEN/RIYAZ-VIP/build/outputs/aar/*-release.aar
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release AAR
        uses: actions/download-artifact@v4
        with:
          name: parallax-sdk-release-aar
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.aar
